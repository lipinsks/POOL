<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CueMaster Mobile - Trener Pozycji</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #090d14;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            touch-action: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #10b981;
            border: 2px solid #ffffff;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-5xl mx-auto px-2.5 py-2 sm:p-4 gap-2.5">

    <!-- 1. Minimalistyczny Pasek Górny -->
    <header class="flex items-center justify-between gap-2 bg-slate-900/90 border border-slate-800/80 px-3 py-2 rounded-xl">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-emerald-500 flex items-center justify-center font-extrabold text-slate-950 text-xs shadow">9</div>
            <span class="font-bold text-sm tracking-tight text-white">CueMaster</span>
            <span id="status-pill" class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                ±1.2 cm
            </span>
        </div>

        <!-- Szybkie akcje na stole -->
        <div class="flex items-center gap-1.5">
            <button onclick="addBlockerBall()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 active:bg-slate-700 text-slate-200 border border-slate-700" title="Dodaj przeszkodę">
                +Bila
            </button>
            <button id="btn-clear-blockers" onclick="clearBlockers()" class="hidden px-2 py-1.5 rounded-lg text-xs font-semibold bg-rose-950/60 text-rose-300 border border-rose-800/60">
                Usuń
            </button>
            <button onclick="toggleClothColor()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 active:bg-slate-700 text-slate-300 border border-slate-700">
                Sukno
            </button>
            <select onchange="loadPreset(this.value)" class="bg-slate-800 text-slate-200 text-xs font-semibold rounded-lg px-2 py-1.5 border border-slate-700 outline-none">
                <option value="oneRail">Układ 1: 1 banda</option>
                <option value="drawAngle">Układ 2: Wsteczna</option>
                <option value="twoRailsSpin">Układ 3: 2 bandy</option>
                <option value="obstacleAvoid">Układ 4: Przeszkoda</option>
            </select>
        </div>
    </header>

    <!-- 2. Stół Bilardowy + Szybki Wybór Trybu Dotyku (Dla małych ekranów) -->
    <div class="flex flex-col gap-2">
        <!-- Przełącznik dla wygodnego ustawiania jednym stuknięciem na telefonie -->
        <div class="grid grid-cols-4 gap-1.5 bg-slate-900/80 p-1 rounded-xl border border-slate-800/80 text-xs">
            <button id="mode-drag" onclick="setInteractionMode('drag')" class="mode-btn py-1.5 rounded-lg font-semibold bg-emerald-600 text-white shadow text-center transition">
                Przesuwaj
            </button>
            <button id="mode-cue" onclick="setInteractionMode('cue')" class="mode-btn py-1.5 rounded-lg font-medium text-slate-300 hover:bg-slate-800 flex items-center justify-center gap-1 transition">
                <span class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span> Biała
            </button>
            <button id="mode-object" onclick="setInteractionMode('object')" class="mode-btn py-1.5 rounded-lg font-medium text-slate-300 hover:bg-slate-800 flex items-center justify-center gap-1 transition">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block"></span> Cel (9)
            </button>
            <button id="mode-target" onclick="setInteractionMode('target')" class="mode-btn py-1.5 rounded-lg font-medium text-slate-300 hover:bg-slate-800 flex items-center justify-center gap-1 transition">
                <span class="w-2.5 h-2.5 rounded-full border-2 border-cyan-400 inline-block"></span> Pozycja
            </button>
        </div>

        <!-- Kontener Stołu -->
        <div id="canvas-wrapper" class="w-full bg-slate-950 rounded-2xl p-1 sm:p-2 border border-slate-800 shadow-2xl relative flex items-center justify-center">
            <canvas id="poolTableCanvas" class="w-full h-auto rounded-xl block"></canvas>
        </div>

        <!-- Pasek Wariantów (Przewijany poziomo na smartfonie) -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5" id="variants-container">
            <!-- Wypełniane dynamicznie -->
        </div>
    </div>

    <!-- 3. Kompaktowy Panel Sterowania: Biała Bila (Tip) + Siła + Animacja -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 sm:p-4 shadow-xl grid grid-cols-12 gap-3 sm:gap-5 items-center">
        
        <!-- Lewa strona: Punkt uderzenia na białej bili (5 kolumn na tel, 4 na desktopie) -->
        <div class="col-span-5 sm:col-span-4 flex flex-col items-center justify-center border-r border-slate-800/80 pr-2 sm:pr-4">
            <div class="relative flex items-center justify-center">
                <canvas id="cueBallSelectorCanvas" width="136" height="136" class="w-[115px] h-[115px] sm:w-[136px] sm:h-[136px] cursor-crosshair rounded-full shadow-lg"></canvas>
                <span class="absolute -top-1.5 text-[9px] font-bold uppercase tracking-wider text-slate-400 bg-slate-900 px-1 rounded">Góra</span>
                <span class="absolute -bottom-1.5 text-[9px] font-bold uppercase tracking-wider text-slate-400 bg-slate-900 px-1 rounded">Dół</span>
            </div>
            <div class="mt-2 text-center">
                <div id="tip-summary-label" class="text-xs font-bold text-emerald-400 leading-tight">Follow 45%</div>
                <div id="tip-side-label" class="text-[10px] font-mono text-slate-400">Prawa 15% • 1.1 tipa</div>
            </div>
        </div>

        <!-- Prawa strona: Siła (1-100) + Przyciski akcji (7 kolumn na tel, 8 na desktopie) -->
        <div class="col-span-7 sm:col-span-8 flex flex-col justify-between gap-3">
            
            <!-- Sekcja Siły -->
            <div class="bg-slate-950/70 p-2.5 sm:p-3 rounded-xl border border-slate-800/80 space-y-2">
                <div class="flex items-baseline justify-between">
                    <div>
                        <span class="text-xs font-bold text-slate-200 uppercase tracking-wide">Siła uderzenia</span>
                        <span id="power-word-desc" class="block text-[11px] text-amber-400 font-medium">Średnie tempo</span>
                    </div>
                    <div class="text-right font-mono">
                        <span id="power-value-big" class="text-2xl font-extrabold text-emerald-400">48</span>
                        <span class="text-xs text-slate-500">/100</span>
                    </div>
                </div>

                <!-- Pasek wizualny + Suwak dotykowy -->
                <div class="relative pt-0.5">
                    <div class="w-full h-2 bg-slate-900 rounded-full overflow-hidden mb-2">
                        <div id="power-bar-fill" class="h-full bg-gradient-to-r from-emerald-500 via-amber-400 to-rose-500" style="width: 48%;"></div>
                    </div>
                    <input id="power-slider" type="range" min="1" max="100" step="1" value="48" class="w-full">
                </div>

                <div class="flex justify-between text-[10px] font-mono text-slate-400">
                    <span id="cut-angle-info">Kąt cięcia: 24°</span>
                    <span id="power-ms-readout">V₀: 2.15 m/s</span>
                </div>
            </div>

            <!-- Przyciski Akcji -->
            <div class="flex items-center gap-2">
                <button id="btn-simulate" onclick="startRealtimeAnimation()" class="flex-1 py-3 px-3 rounded-xl font-bold text-xs sm:text-sm bg-emerald-500 active:bg-emerald-400 text-slate-950 shadow-lg shadow-emerald-950/50 transition flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4 fill-current shrink-0" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span id="btn-simulate-text">Odtwórz uderzenie</span>
                </button>

                <button onclick="applySolvedToTable()" class="py-3 px-3 rounded-xl text-xs font-bold bg-slate-800 active:bg-slate-700 text-emerald-400 border border-slate-700 transition" title="Przywróć automatycznie wyliczony najlepszy punkt uderzenia">
                    Auto
                </button>
            </div>
        </div>

    </div>

    <!-- Legenda na samym dole -->
    <footer class="flex items-center justify-center gap-4 text-[10px] text-slate-400 pb-1">
        <span class="flex items-center gap-1"><span class="w-2.5 h-1 bg-sky-400 rounded inline-block"></span> Poślizg (parabola)</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-1 bg-emerald-400 rounded inline-block"></span> Toczenie</span>
        <span class="flex items-center gap-1"><span class="w-2.5 h-1 bg-amber-400 rounded inline-block"></span> Tor bili (9)</span>
    </footer>

    <!-- SILNIK FIZYCZNY 3D I LOGIKA APLIKACJI -->
    <script>
        const PHYSICS = {
            TABLE_W: 2.54,
            TABLE_H: 1.27,
            BALL_R: 0.028575,
            G: 9.81,
            MU_SLIDE: 0.20,
            MU_ROLL: 0.0165,
            MU_SPIN_DECAY: 0.022,
            RAIL_RESTITUTION: 0.76,
            RAIL_SPIN_FACTOR: 0.28,
            POCKET_RADIUS: 0.068
        };

        const POCKETS = [
            { id: 0, name: "Lewa Górna",     x: 0.0,               y: 0.0,                  aimX: 0.022,                  aimY: 0.022 },
            { id: 1, name: "Środkowa Górna", x: PHYSICS.TABLE_W/2, y: -0.012,               aimX: PHYSICS.TABLE_W/2,      aimY: 0.012 },
            { id: 2, name: "Prawa Górna",    x: PHYSICS.TABLE_W,   y: 0.0,                  aimX: PHYSICS.TABLE_W - 0.022, aimY: 0.022 },
            { id: 3, name: "Lewa Dolna",     x: 0.0,               y: PHYSICS.TABLE_H,      aimX: 0.022,                  aimY: PHYSICS.TABLE_H - 0.022 },
            { id: 4, name: "Środkowa Dolna", x: PHYSICS.TABLE_W/2, y: PHYSICS.TABLE_H+0.012, aimX: PHYSICS.TABLE_W/2,     aimY: PHYSICS.TABLE_H - 0.012 },
            { id: 5, name: "Prawa Dolna",    x: PHYSICS.TABLE_W,   y: PHYSICS.TABLE_H,      aimX: PHYSICS.TABLE_W - 0.022, aimY: PHYSICS.TABLE_H - 0.022 }
        ];

        const state = {
            cueBall: { x: 0.72, y: 0.88 },
            objectBall: { x: 1.82, y: 0.36, number: 9 },
            targetPos: { x: 1.55, y: 0.85 },
            blockers: [],
            selectedPocketId: 2,
            shotParams: { power: 48, tipX: 0.15, tipY: 0.45 },
            solvedVariants: [],
            activeVariantIndex: 0,
            currentSimulatedResult: null,
            manualOverride: false,
            interactionMode: 'drag',
            draggingEntity: null,
            clothTournamentBlue: false,
            animating: false,
            animStartTime: 0
        };

        const tableCanvas = document.getElementById('poolTableCanvas');
        const ctx = tableCanvas.getContext('2d');
        const tipCanvas = document.getElementById('cueBallSelectorCanvas');
        const tipCtx = tipCanvas.getContext('2d');

        let renderMetrics = { scale: 400, padX: 40, padY: 40 };

        function powerToVelocity(power) {
            const norm = Math.max(1, Math.min(100, power)) / 100;
            return 0.30 + 4.90 * Math.pow(norm, 1.28);
        }

        function getPowerDescription(power) {
            if (power <= 15) return "Delikatne dotoczenie";
            if (power <= 32) return "Lekkie uderzenie";
            if (power <= 55) return "Średnie tempo";
            if (power <= 78) return "Mocne uderzenie";
            return "Maksymalna siła";
        }

        function computeGhostBallGeometry(cuePos, objPos, pocketId) {
            const pocket = POCKETS[pocketId];
            const dxObjPocket = pocket.aimX - objPos.x;
            const dyObjPocket = pocket.aimY - objPos.y;
            const distToPocket = Math.hypot(dxObjPocket, dyObjPocket);

            const nx = dxObjPocket / (distToPocket || 1e-6);
            const ny = dyObjPocket / (distToPocket || 1e-6);

            const ghostX = objPos.x - nx * (2 * PHYSICS.BALL_R);
            const ghostY = objPos.y - ny * (2 * PHYSICS.BALL_R);

            const dxAim = ghostX - cuePos.x;
            const dyAim = ghostY - cuePos.y;
            const distAim = Math.hypot(dxAim, dyAim);

            const ux = dxAim / (distAim || 1e-6);
            const uy = dyAim / (distAim || 1e-6);

            const cosCut = ux * nx + uy * ny;
            const cutAngleRad = Math.acos(Math.max(-1, Math.min(1, cosCut)));
            const cutAngleDeg = cutAngleRad * (180 / Math.PI);

            const R = PHYSICS.BALL_R;
            const ghostOnTable = (ghostX >= R * 0.9 && ghostX <= PHYSICS.TABLE_W - R * 0.9 &&
                                  ghostY >= R * 0.9 && ghostY <= PHYSICS.TABLE_H - R * 0.9);

            const isPossible = (cosCut > 0.11) && ghostOnTable && (distAim > 2 * R);

            return {
                ghostX, ghostY, nx, ny, ux, uy,
                distAim, distToPocket, cosCut,
                sinCut: Math.sin(cutAngleRad),
                cutAngleRad, cutAngleDeg, isPossible, pocket
            };
        }

        function distPointToSegment(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
        }

        function simulateShotPhysics(power, tipX, tipY, geom, recordFullPath = true) {
            const R = PHYSICS.BALL_R;
            const g = PHYSICS.G;
            const v0 = powerToVelocity(power);

            const maxOffsetRatio = 0.72;
            const normTipMag = Math.hypot(tipX, tipY);
            let effTipX = tipX;
            let effTipY = tipY;
            if (normTipMag > 1.0) {
                effTipX /= normTipMag;
                effTipY /= normTipMag;
            }

            const a = effTipX * maxOffsetRatio * R;
            const b = effTipY * maxOffsetRatio * R;

            let w_forward = (2.5 * v0 * b) / (R * R);
            let wz = (2.5 * v0 * a) / (R * R);

            let v_pre = v0;
            let t_travel = 0;
            const dt_pre = 0.004;
            let distRemaining = geom.distAim;
            let preCollisionFoul = false;

            for (let bIdx = 0; bIdx < state.blockers.length; bIdx++) {
                const blk = state.blockers[bIdx];
                if (distPointToSegment(blk.x, blk.y, state.cueBall.x, state.cueBall.y, geom.ghostX, geom.ghostY) < 2.02 * R) {
                    preCollisionFoul = true; break;
                }
            }
            for (let bIdx = 0; bIdx < state.blockers.length; bIdx++) {
                const blk = state.blockers[bIdx];
                if (distPointToSegment(blk.x, blk.y, state.objectBall.x, state.objectBall.y, geom.pocket.aimX, geom.pocket.aimY) < 1.98 * R) {
                    preCollisionFoul = true; break;
                }
            }

            while (distRemaining > 0 && v_pre > 0.05) {
                const stepDist = Math.min(distRemaining, v_pre * dt_pre);
                const stepDt = stepDist / v_pre;
                const u_slip = v_pre - R * w_forward;

                if (Math.abs(u_slip) > 0.02) {
                    const signSlip = Math.sign(u_slip);
                    v_pre -= signSlip * PHYSICS.MU_SLIDE * g * stepDt;
                    w_forward += signSlip * (2.5 * PHYSICS.MU_SLIDE * g / R) * stepDt;
                } else {
                    v_pre -= PHYSICS.MU_ROLL * g * stepDt;
                    w_forward = v_pre / R;
                }

                const wzDecay = PHYSICS.MU_SPIN_DECAY * g * stepDt / R;
                if (Math.abs(wz) > wzDecay) wz -= Math.sign(wz) * wzDecay;
                else wz = 0;

                distRemaining -= stepDist;
                t_travel += stepDt;
            }

            if (v_pre <= 0.08) {
                return {
                    reachedObjectBall: false, foul: true,
                    finalX: state.cueBall.x, finalY: state.cueBall.y,
                    distToTarget: 99, railBounces: 0, cuePath: [], objPath: []
                };
            }

            const v_n_mag = v_pre * geom.cosCut;
            const objVx0 = geom.nx * v_n_mag * 0.97;
            const objVy0 = geom.ny * v_n_mag * 0.97;

            let vx = v_pre * (geom.ux - geom.cosCut * geom.nx) * 0.96;
            let vy = v_pre * (geom.uy - geom.cosCut * geom.ny) * 0.96;

            let vrx = geom.ux * (R * w_forward);
            let vry = geom.uy * (R * w_forward);

            let x = geom.ghostX;
            let y = geom.ghostY;
            let t = t_travel;
            const dt = 0.0025;

            let railBounces = 0;
            let scratchFoul = false;
            let blockerCollision = preCollisionFoul;

            const cuePath = [];
            if (recordFullPath) {
                cuePath.push({ x: state.cueBall.x, y: state.cueBall.y, t: 0, phase: 'aim' });
                cuePath.push({ x: geom.ghostX, y: geom.ghostY, t: t_travel, phase: 'impact' });
            }

            let stepCounter = 0;
            while (stepCounter < 4500) {
                stepCounter++;
                const speed = Math.hypot(vx, vy);
                const rotSpeed = Math.hypot(vrx, vry);

                if (speed < 0.015 && rotSpeed < 0.015) {
                    vx = 0; vy = 0; break;
                }

                const sx = vx - vrx;
                const sy = vy - vry;
                const slipSpeed = Math.hypot(sx, sy);
                let currentPhase = 'roll';

                if (slipSpeed > 0.025) {
                    currentPhase = 'slide';
                    const invSlip = 1.0 / slipSpeed;
                    const dirX = sx * invSlip;
                    const dirY = sy * invSlip;
                    const dv = PHYSICS.MU_SLIDE * g * dt;
                    const dvr = 2.5 * PHYSICS.MU_SLIDE * g * dt;

                    if (dv + dvr >= slipSpeed) {
                        vx = (5 * vx + 2 * vrx) / 7;
                        vy = (5 * vy + 2 * vry) / 7;
                        vrx = vx; vry = vy;
                    } else {
                        vx -= dirX * dv; vy -= dirY * dv;
                        vrx += dirX * dvr; vry += dirY * dvr;
                    }
                } else {
                    currentPhase = 'roll';
                    if (speed > 0.001) {
                        const decel = PHYSICS.MU_ROLL * g * dt;
                        const newSpeed = Math.max(0, speed - decel);
                        const ratio = newSpeed / speed;
                        vx *= ratio; vy *= ratio;
                        vrx = vx; vry = vy;
                    } else {
                        vx = 0; vy = 0; vrx = 0; vry = 0;
                    }
                }

                const wzDecay = (PHYSICS.MU_SPIN_DECAY * g / R) * dt;
                if (Math.abs(wz) > wzDecay) wz -= Math.sign(wz) * wzDecay;
                else wz = 0;

                x += vx * dt;
                y += vy * dt;
                t += dt;

                for (let p = 0; p < POCKETS.length; p++) {
                    const pk = POCKETS[p];
                    if (Math.hypot(x - pk.x, y - pk.y) < PHYSICS.POCKET_RADIUS) {
                        scratchFoul = true; break;
                    }
                }
                if (scratchFoul) {
                    if (recordFullPath) cuePath.push({ x, y, t, phase: currentPhase });
                    break;
                }

                for (let b = 0; b < state.blockers.length; b++) {
                    const blk = state.blockers[b];
                    if (Math.hypot(x - blk.x, y - blk.y) < 2 * R) {
                        blockerCollision = true; break;
                    }
                }

                let bouncedThisStep = false;
                if (x < R && vx < 0) {
                    x = R; vx = -vx * PHYSICS.RAIL_RESTITUTION;
                    vy = vy * 0.88 - wz * R * PHYSICS.RAIL_SPIN_FACTOR;
                    vrx = vx * 0.45; vry = vy * 0.75; wz *= 0.55; bouncedThisStep = true;
                } else if (x > PHYSICS.TABLE_W - R && vx > 0) {
                    x = PHYSICS.TABLE_W - R; vx = -vx * PHYSICS.RAIL_RESTITUTION;
                    vy = vy * 0.88 + wz * R * PHYSICS.RAIL_SPIN_FACTOR;
                    vrx = vx * 0.45; vry = vy * 0.75; wz *= 0.55; bouncedThisStep = true;
                }

                if (y < R && vy < 0) {
                    y = R; vy = -vy * PHYSICS.RAIL_RESTITUTION;
                    vx = vx * 0.88 + wz * R * PHYSICS.RAIL_SPIN_FACTOR;
                    vry = vy * 0.45; vrx = vx * 0.75; wz *= 0.55; bouncedThisStep = true;
                } else if (y > PHYSICS.TABLE_H - R && vy > 0) {
                    y = PHYSICS.TABLE_H - R; vy = -vy * PHYSICS.RAIL_RESTITUTION;
                    vx = vx * 0.88 - wz * R * PHYSICS.RAIL_SPIN_FACTOR;
                    vry = vy * 0.45; vrx = vx * 0.75; wz *= 0.55; bouncedThisStep = true;
                }

                if (bouncedThisStep) {
                    railBounces++;
                    if (recordFullPath) cuePath.push({ x, y, t, phase: currentPhase, bounce: true });
                } else if (recordFullPath && (stepCounter % 5 === 0)) {
                    cuePath.push({ x, y, t, phase: currentPhase });
                }
            }

            if (recordFullPath) cuePath.push({ x, y, t, phase: 'stop' });

            let objPocketed = true;
            const objSpeed0 = Math.hypot(objVx0, objVy0);
            const minSpeedToReachPocket = Math.sqrt(2 * PHYSICS.MU_ROLL * g * geom.distToPocket * 0.85);
            if (objSpeed0 < minSpeedToReachPocket) objPocketed = false;

            const objPath = [];
            if (recordFullPath) {
                objPath.push({ x: state.objectBall.x, y: state.objectBall.y, t: t_travel });
                const objTravelTime = geom.distToPocket / Math.max(0.25, objSpeed0 * 0.82);
                objPath.push({ x: geom.pocket.x, y: geom.pocket.y, t: t_travel + objTravelTime });
            }

            const distToTarget = Math.hypot(x - state.targetPos.x, y - state.targetPos.y);

            return {
                power, tipX: effTipX, tipY: effTipY,
                reachedObjectBall: true, objPocketed,
                foul: scratchFoul || blockerCollision || !objPocketed,
                scratchFoul, blockerCollision,
                finalX: x, finalY: y, distToTarget,
                railBounces, cuePath, objPath, totalTime: t
            };
        }

        function scoreCandidate(simResult) {
            if (!simResult.reachedObjectBall || simResult.foul) return 99999 + simResult.distToTarget * 100;
            let cost = simResult.distToTarget * 120.0;
            cost += (Math.abs(simResult.power - 44) / 100) * 1.4;
            if (simResult.power > 85) cost += 2.5;
            cost += Math.abs(simResult.tipX) * 1.35;
            const tipMag = Math.hypot(simResult.tipX, simResult.tipY);
            if (tipMag > 0.85) cost += (tipMag - 0.85) * 4.0;
            return cost;
        }

        function runInverseSolver() {
            const geom = computeGhostBallGeometry(state.cueBall, state.objectBall, state.selectedPocketId);
            if (!geom.isPossible) {
                state.solvedVariants = [];
                updateVariantsUI(geom);
                recalculateCurrentManualShot();
                return;
            }

            const bestByRails = { 0: null, 1: null, 2: null, 3: null };
            const powers = [16, 26, 36, 46, 56, 68, 80, 92];
            const tipYs  = [-0.90, -0.65, -0.40, -0.15, 0.0, 0.25, 0.55, 0.85];
            const tipXs  = [-0.75, -0.35, 0.0, 0.35, 0.75];

            for (let p of powers) {
                for (let ty of tipYs) {
                    for (let tx of tipXs) {
                        if (tx * tx + ty * ty > 1.05) continue;
                        const res = simulateShotPhysics(p, tx, ty, geom, false);
                        if (res.foul) continue;
                        const bucket = Math.min(3, res.railBounces);
                        const score = scoreCandidate(res);
                        if (!bestByRails[bucket] || score < bestByRails[bucket].score) {
                            bestByRails[bucket] = { power: p, tipX: tx, tipY: ty, score, res };
                        }
                    }
                }
            }

            const refinedVariants = [];
            Object.keys(bestByRails).forEach(railKey => {
                const candidate = bestByRails[railKey];
                if (!candidate) return;

                let bestP = candidate.power;
                let bestTX = candidate.tipX;
                let bestTY = candidate.tipY;
                let bestScore = candidate.score;

                const steps = [{ dp: 5, dt: 0.12 }, { dp: 2, dt: 0.05 }, { dp: 1, dt: 0.02 }];
                for (let st of steps) {
                    let improved = true;
                    let iter = 0;
                    while (improved && iter < 8) {
                        improved = false; iter++;
                        const deltas = [
                            [st.dp, 0, 0], [-st.dp, 0, 0],
                            [0, st.dt, 0], [0, -st.dt, 0],
                            [0, 0, st.dt], [0, 0, -st.dt],
                            [st.dp, 0, st.dt], [-st.dp, 0, -st.dt]
                        ];
                        for (let [dp, dtx, dty] of deltas) {
                            const np = Math.max(1, Math.min(100, bestP + dp));
                            let ntx = bestTX + dtx;
                            let nty = bestTY + dty;
                            const mag = Math.hypot(ntx, nty);
                            if (mag > 1.0) { ntx /= mag; nty /= mag; }

                            const r = simulateShotPhysics(np, ntx, nty, geom, false);
                            if (r.foul) continue;
                            const sc = scoreCandidate(r);
                            if (sc < bestScore) {
                                bestScore = sc; bestP = np; bestTX = ntx; bestTY = nty;
                                improved = true;
                            }
                        }
                    }
                }

                const fullSim = simulateShotPhysics(bestP, bestTX, bestTY, geom, true);
                if (fullSim.distToTarget < 0.42) {
                    refinedVariants.push({
                        railCategory: parseInt(railKey),
                        railBounces: fullSim.railBounces,
                        score: bestScore,
                        sim: fullSim
                    });
                }
            });

            refinedVariants.sort((a, b) => a.score - b.score);

            if (refinedVariants.length === 0) {
                let fallbackBest = null;
                Object.values(bestByRails).forEach(c => {
                    if (c && (!fallbackBest || c.score < fallbackBest.score)) fallbackBest = c;
                });
                if (fallbackBest) {
                    const fullSim = simulateShotPhysics(fallbackBest.power, fallbackBest.tipX, fallbackBest.tipY, geom, true);
                    refinedVariants.push({
                        railCategory: fullSim.railBounces,
                        railBounces: fullSim.railBounces,
                        score: fallbackBest.score,
                        sim: fullSim
                    });
                }
            }

            state.solvedVariants = refinedVariants;
            state.activeVariantIndex = 0;
            state.manualOverride = false;

            if (refinedVariants.length > 0) {
                const best = refinedVariants[0].sim;
                state.shotParams.power = Math.round(best.power);
                state.shotParams.tipX = best.tipX;
                state.shotParams.tipY = best.tipY;
                state.currentSimulatedResult = best;
            } else {
                recalculateCurrentManualShot();
            }

            updateVariantsUI(geom);
            syncControlsWithShotParams();
            renderAll();
        }

        function selectVariant(index) {
            if (!state.solvedVariants[index]) return;
            state.activeVariantIndex = index;
            state.manualOverride = false;
            const chosen = state.solvedVariants[index].sim;
            state.shotParams.power = Math.round(chosen.power);
            state.shotParams.tipX = chosen.tipX;
            state.shotParams.tipY = chosen.tipY;
            state.currentSimulatedResult = chosen;

            const geom = computeGhostBallGeometry(state.cueBall, state.objectBall, state.selectedPocketId);
            updateVariantsUI(geom);
            syncControlsWithShotParams();
            renderAll();
        }

        function applySolvedToTable() {
            if (state.solvedVariants.length > 0) selectVariant(0);
            else runInverseSolver();
        }

        function recalculateCurrentManualShot() {
            const geom = computeGhostBallGeometry(state.cueBall, state.objectBall, state.selectedPocketId);
            state.currentSimulatedResult = simulateShotPhysics(
                state.shotParams.power,
                state.shotParams.tipX,
                state.shotParams.tipY,
                geom,
                true
            );
            syncControlsWithShotParams();
            renderAll();
        }

        function updateVariantsUI(geom) {
            const container = document.getElementById('variants-container');
            document.getElementById('cut-angle-info').textContent = `Cięcie: ${geom.cutAngleDeg.toFixed(0)}°`;

            if (!geom.isPossible) {
                container.innerHTML = `<div class="w-full bg-rose-950/50 border border-rose-800 rounded-xl px-3 py-2 text-xs text-rose-300 text-center">Kąt > 83° lub zasłonięta łuza – przesuń bilę lub wybierz inną łuzę.</div>`;
                return;
            }

            if (state.solvedVariants.length === 0) {
                container.innerHTML = `<div class="w-full bg-amber-950/50 border border-amber-800 rounded-xl px-3 py-2 text-xs text-amber-300 text-center">Brak czystej ścieżki bez faulu – przesuń pozycję docelową.</div>`;
                return;
            }

            container.innerHTML = state.solvedVariants.map((v, idx) => {
                const isSelected = (!state.manualOverride && idx === state.activeVariantIndex);
                const errCm = (v.sim.distToTarget * 100).toFixed(0);
                const vDesc = v.sim.tipY > 0.15 ? 'Góra' : (v.sim.tipY < -0.15 ? 'Wsteczna' : 'Stop');
                const railText = v.railBounces === 0 ? '0 band' : (v.railBounces === 1 ? '1 banda' : `${v.railBounces} bandy`);
                return `
                    <button onclick="selectVariant(${idx})" class="shrink-0 px-3 py-2 rounded-xl border text-xs transition flex items-center gap-2 ${
                        isSelected
                        ? 'bg-emerald-950/80 border-emerald-500 text-white shadow'
                        : 'bg-slate-900/90 border-slate-800 text-slate-300'
                    }">
                        <span class="font-bold ${isSelected ? 'text-emerald-400' : 'text-white'}">${railText}</span>
                        <span class="text-slate-400 font-mono text-[11px]">Siła ${Math.round(v.sim.power)} • ${vDesc}</span>
                        <span class="font-mono text-[10px] px-1.5 py-0.5 rounded bg-slate-950 ${v.sim.distToTarget < 0.08 ? 'text-emerald-400' : 'text-amber-400'}">±${errCm}cm</span>
                    </button>
                `;
            }).join('');
        }

        function syncControlsWithShotParams() {
            const { power, tipX, tipY } = state.shotParams;
            const sim = state.currentSimulatedResult;

            const vertPct = Math.round(Math.abs(tipY) * 100);
            const sumEl = document.getElementById('tip-summary-label');
            if (tipY > 0.12) {
                sumEl.textContent = `Góra (Follow) ${vertPct}%`;
                sumEl.className = "text-xs font-bold text-emerald-400";
            } else if (tipY < -0.12) {
                sumEl.textContent = `Dół (Draw) ${vertPct}%`;
                sumEl.className = "text-xs font-bold text-rose-400";
            } else {
                sumEl.textContent = `Środek (Stun)`;
                sumEl.className = "text-xs font-bold text-amber-300";
            }

            const horzPct = Math.round(Math.abs(tipX) * 100);
            const sideText = tipX > 0.08 ? `Prawa ${horzPct}%` : (tipX < -0.08 ? `Lewa ${horzPct}%` : `Bez bocznej`);
            const tipsOffset = (Math.hypot(tipX, tipY) * 1.65).toFixed(1);
            document.getElementById('tip-side-label').textContent = `${sideText} • ${tipsOffset} tipa`;

            const roundedPower = Math.round(power);
            document.getElementById('power-value-big').textContent = roundedPower;
            document.getElementById('power-bar-fill').style.width = `${roundedPower}%`;
            document.getElementById('power-slider').value = roundedPower;
            document.getElementById('power-word-desc').textContent = getPowerDescription(roundedPower);
            document.getElementById('power-ms-readout').textContent = `V₀: ${powerToVelocity(roundedPower).toFixed(2)} m/s`;

            const statusPill = document.getElementById('status-pill');
            if (sim) {
                if (sim.foul) {
                    statusPill.textContent = sim.scratchFoul ? "FAUL: Biała w łuzie!" : "FAUL / Kolizja";
                    statusPill.className = "text-[11px] font-mono px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40";
                } else {
                    const errCm = (sim.distToTarget * 100).toFixed(1);
                    statusPill.textContent = `Do celu: ±${errCm} cm`;
                    statusPill.className = "text-[11px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30";
                }
            }

            drawCueBallSelector();
        }

        function drawCueBallSelector() {
            const w = tipCanvas.width;
            const h = tipCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const ballRadiusPx = w * 0.43;
            const maxTipRadiusPx = ballRadiusPx * 0.72;

            tipCtx.clearRect(0, 0, w, h);

            tipCtx.save();
            tipCtx.beginPath();
            tipCtx.arc(cx, cy, ballRadiusPx, 0, Math.PI * 2);
            const ballGrad = tipCtx.createRadialGradient(cx - ballRadiusPx * 0.3, cy - ballRadiusPx * 0.3, ballRadiusPx * 0.05, cx, cy, ballRadiusPx);
            ballGrad.addColorStop(0, '#ffffff');
            ballGrad.addColorStop(0.7, '#f1f5f9');
            ballGrad.addColorStop(1, '#94a3b8');
            tipCtx.fillStyle = ballGrad;
            tipCtx.fill();
            tipCtx.lineWidth = 1.5;
            tipCtx.strokeStyle = '#475569';
            tipCtx.stroke();

            tipCtx.beginPath();
            tipCtx.arc(cx, cy, maxTipRadiusPx, 0, Math.PI * 2);
            tipCtx.setLineDash([3, 3]);
            tipCtx.strokeStyle = 'rgba(239, 68, 68, 0.45)';
            tipCtx.lineWidth = 1.2;
            tipCtx.stroke();

            tipCtx.setLineDash([]);
            tipCtx.strokeStyle = 'rgba(71, 85, 105, 0.35)';
            tipCtx.beginPath();
            tipCtx.moveTo(cx - ballRadiusPx * 0.8, cy);
            tipCtx.lineTo(cx + ballRadiusPx * 0.8, cy);
            tipCtx.moveTo(cx, cy - ballRadiusPx * 0.8);
            tipCtx.lineTo(cx, cy + ballRadiusPx * 0.8);
            tipCtx.stroke();

            const dotX = cx + state.shotParams.tipX * maxTipRadiusPx;
            const dotY = cy - state.shotParams.tipY * maxTipRadiusPx;

            const leatherTipRadiusPx = ballRadiusPx * 0.21;
            tipCtx.beginPath();
            tipCtx.arc(dotX, dotY, leatherTipRadiusPx, 0, Math.PI * 2);
            tipCtx.fillStyle = 'rgba(239, 68, 68, 0.22)';
            tipCtx.fill();
            tipCtx.strokeStyle = 'rgba(220, 38, 38, 0.7)';
            tipCtx.stroke();

            tipCtx.beginPath();
            tipCtx.arc(dotX, dotY, 5.5, 0, Math.PI * 2);
            tipCtx.fillStyle = '#ef4444';
            tipCtx.fill();
            tipCtx.lineWidth = 1.5;
            tipCtx.strokeStyle = '#ffffff';
            tipCtx.stroke();
            tipCtx.restore();
        }

        function resizeTableCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const availW = wrapper.clientWidth - 8;
            const targetCanvasW = Math.max(320, Math.min(1000, availW));
            const pad = Math.max(24, Math.round(targetCanvasW * 0.05));
            const playW = targetCanvasW - 2 * pad;
            const playH = Math.round(playW / 2);
            const targetCanvasH = playH + 2 * pad;

            tableCanvas.width = targetCanvasW;
            tableCanvas.height = targetCanvasH;

            renderMetrics.padX = pad;
            renderMetrics.padY = pad;
            renderMetrics.scale = playW / PHYSICS.TABLE_W;

            renderAll();
        }

        function m2pxX(mx) { return renderMetrics.padX + mx * renderMetrics.scale; }
        function m2pxY(my) { return renderMetrics.padY + my * renderMetrics.scale; }
        function px2mX(px) { return (px - renderMetrics.padX) / renderMetrics.scale; }
        function px2mY(py) { return (py - renderMetrics.padY) / renderMetrics.scale; }

        function renderAll(animTimestamp = null) {
            const w = tableCanvas.width;
            const h = tableCanvas.height;
            const padX = renderMetrics.padX;
            const padY = renderMetrics.padY;
            const playW = PHYSICS.TABLE_W * renderMetrics.scale;
            const playH = PHYSICS.TABLE_H * renderMetrics.scale;
            const ballPxR = PHYSICS.BALL_R * renderMetrics.scale;

            ctx.clearRect(0, 0, w, h);

            // Rama stołu
            ctx.fillStyle = '#29170e';
            ctx.beginPath();
            ctx.roundRect(0, 0, w, h, 14);
            ctx.fill();

            // Bandy
            const cushionThick = padX * 0.26;
            ctx.fillStyle = state.clothTournamentBlue ? '#114f66' : '#0b4628';
            ctx.fillRect(padX - cushionThick, padY - cushionThick, playW + 2 * cushionThick, playH + 2 * cushionThick);

            // Sukno
            const feltGrad = ctx.createRadialGradient(w / 2, h / 2, playW * 0.05, w / 2, h / 2, playW * 0.7);
            if (state.clothTournamentBlue) {
                feltGrad.addColorStop(0, '#1f88ab');
                feltGrad.addColorStop(1, '#15627d');
            } else {
                feltGrad.addColorStop(0, '#187c4c');
                feltGrad.addColorStop(1, '#105433');
            }
            ctx.fillStyle = feltGrad;
            ctx.fillRect(padX, padY, playW, playH);

            // Linia bazy
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            const headStringX = m2pxX(PHYSICS.TABLE_W * 0.25);
            ctx.moveTo(headStringX, padY);
            ctx.lineTo(headStringX, padY + playH);
            ctx.stroke();

            // Diamenty
            ctx.fillStyle = '#cbd5e1';
            for (let i = 1; i <= 7; i++) {
                if (i === 4) continue;
                const dx = padX + (playW / 8) * i;
                ctx.beginPath(); ctx.arc(dx, padY * 0.45, 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(dx, padY + playH + padY * 0.55, 2, 0, Math.PI * 2); ctx.fill();
            }
            for (let j = 1; j <= 3; j++) {
                const dy = padY + (playH / 4) * j;
                ctx.beginPath(); ctx.arc(padX * 0.45, dy, 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(padX + playW + padX * 0.55, dy, 2, 0, Math.PI * 2); ctx.fill();
            }

            // 6 Łuz
            POCKETS.forEach(pocket => {
                const px = m2pxX(pocket.x);
                const py = m2pxY(pocket.y);
                const pocketR = PHYSICS.POCKET_RADIUS * renderMetrics.scale;
                const isSelected = (pocket.id === state.selectedPocketId);

                ctx.beginPath();
                ctx.arc(px, py, pocketR, 0, Math.PI * 2);
                ctx.fillStyle = '#07090e';
                ctx.fill();

                if (isSelected) {
                    ctx.beginPath();
                    ctx.arc(px, py, pocketR + 3, 0, Math.PI * 2);
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
            });

            const geom = computeGhostBallGeometry(state.cueBall, state.objectBall, state.selectedPocketId);
            const sim = state.currentSimulatedResult;

            drawTargetZone(m2pxX(state.targetPos.x), m2pxY(state.targetPos.y), ballPxR);

            if (geom.isPossible && sim) {
                drawTrajectoriesAndVectors(geom, sim, ballPxR);
            } else {
                ctx.save();
                ctx.beginPath();
                ctx.setLineDash([5, 5]);
                ctx.moveTo(m2pxX(state.cueBall.x), m2pxY(state.cueBall.y));
                ctx.lineTo(m2pxX(geom.ghostX), m2pxY(geom.ghostY));
                ctx.strokeStyle = 'rgba(244, 63, 94, 0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            let cueDrawPos = { x: state.cueBall.x, y: state.cueBall.y };
            let objDrawPos = { x: state.objectBall.x, y: state.objectBall.y };
            let hideObjectBall = false;

            if (state.animating && sim && sim.cuePath.length > 1) {
                const elapsed = (animTimestamp - state.animStartTime) / 1000;
                cueDrawPos = samplePathAtTime(sim.cuePath, elapsed);

                if (sim.objPath && sim.objPath.length >= 2) {
                    const tImpact = sim.objPath[0].t;
                    const tEndObj = sim.objPath[sim.objPath.length - 1].t;
                    if (elapsed >= tImpact) {
                        if (elapsed >= tEndObj && sim.objPocketed) hideObjectBall = true;
                        else objDrawPos = samplePathAtTime(sim.objPath, elapsed);
                    }
                }

                if (elapsed > sim.totalTime + 0.35) {
                    state.animating = false;
                    document.getElementById('btn-simulate-text').textContent = "Odtwórz uderzenie";
                }
            }

            state.blockers.forEach(blk => {
                drawPoolBall(m2pxX(blk.x), m2pxY(blk.y), ballPxR, blk.color, blk.number, false);
            });

            if (!hideObjectBall) {
                drawPoolBall(m2pxX(objDrawPos.x), m2pxY(objDrawPos.y), ballPxR, '#eab308', state.objectBall.number, true);
            }

            drawCueBallOnTable(m2pxX(cueDrawPos.x), m2pxY(cueDrawPos.y), ballPxR);

            if (state.animating) requestAnimationFrame(renderAll);
        }

        function drawTargetZone(px, py, ballPxR) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(px, py, ballPxR * 1.9, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(6, 182, 212, 0.14)';
            ctx.fill();
            ctx.setLineDash([4, 3]);
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            ctx.beginPath();
            ctx.setLineDash([]);
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fillStyle = '#22d3ee';
            ctx.fill();
            ctx.restore();
        }

        function drawTrajectoriesAndVectors(geom, sim, ballPxR) {
            const cuePxX = m2pxX(state.cueBall.x);
            const cuePxY = m2pxY(state.cueBall.y);
            const ghostPxX = m2pxX(geom.ghostX);
            const ghostPxY = m2pxY(geom.ghostY);
            const objPxX = m2pxX(state.objectBall.x);
            const objPxY = m2pxY(state.objectBall.y);
            const pocketPxX = m2pxX(geom.pocket.aimX);
            const pocketPxY = m2pxY(geom.pocket.aimY);

            ctx.save();

            // Linia celowania
            ctx.beginPath();
            ctx.setLineDash([5, 4]);
            ctx.moveTo(cuePxX, cuePxY);
            ctx.lineTo(ghostPxX, ghostPxY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
            ctx.lineWidth = 1.8;
            ctx.stroke();
            ctx.setLineDash([]);

            // Tor bili obiektowej
            ctx.beginPath();
            ctx.moveTo(objPxX, objPxY);
            ctx.lineTo(pocketPxX, pocketPxY);
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Ghost Ball
            ctx.beginPath();
            ctx.arc(ghostPxX, ghostPxY, ballPxR, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.75)';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Krzywa białej bili po zderzeniu
            if (sim.cuePath && sim.cuePath.length > 2) {
                for (let i = 1; i < sim.cuePath.length - 1; i++) {
                    const p1 = sim.cuePath[i];
                    const p2 = sim.cuePath[i + 1];
                    ctx.beginPath();
                    ctx.moveTo(m2pxX(p1.x), m2pxY(p1.y));
                    ctx.lineTo(m2pxX(p2.x), m2pxY(p2.y));

                    if (sim.foul) ctx.strokeStyle = '#f43f5e';
                    else if (p2.phase === 'slide') ctx.strokeStyle = '#38bdf8';
                    else ctx.strokeStyle = '#10b981';

                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Strzałki kierunkowe
                const pathLen = sim.cuePath.length;
                [Math.floor(pathLen * 0.3), Math.floor(pathLen * 0.7)].forEach(idx => {
                    if (idx > 1 && idx < pathLen - 1) {
                        const prev = sim.cuePath[idx - 1];
                        const curr = sim.cuePath[idx];
                        const dx = m2pxX(curr.x) - m2pxX(prev.x);
                        const dy = m2pxY(curr.y) - m2pxY(prev.y);
                        if (Math.hypot(dx, dy) > 2) {
                            const angle = Math.atan2(dy, dx);
                            const color = sim.foul ? '#f43f5e' : (curr.phase === 'slide' ? '#38bdf8' : '#10b981');
                            drawDirectionArrow(m2pxX(curr.x), m2pxY(curr.y), angle, color);
                        }
                    }
                });

                const stopPt = sim.cuePath[sim.cuePath.length - 1];
                ctx.beginPath();
                ctx.arc(m2pxX(stopPt.x), m2pxY(stopPt.y), ballPxR * 0.75, 0, Math.PI * 2);
                ctx.fillStyle = sim.foul ? 'rgba(244, 63, 94, 0.4)' : 'rgba(16, 185, 129, 0.4)';
                ctx.fill();
            }
            ctx.restore();
        }

        function drawDirectionArrow(x, y, angle, color) {
            const headLen = 7;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);
            ctx.beginPath();
            ctx.moveTo(headLen * 0.6, 0);
            ctx.lineTo(-headLen * 0.6, -headLen * 0.55);
            ctx.lineTo(-headLen * 0.3, 0);
            ctx.lineTo(-headLen * 0.6, headLen * 0.55);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.restore();
        }

        function drawPoolBall(px, py, r, color, number, isStripe) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(px + 1.5, py + 2, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fillStyle = isStripe ? '#f8fafc' : color;
            ctx.fill();

            if (isStripe) {
                ctx.save();
                ctx.clip();
                ctx.fillStyle = color;
                ctx.fillRect(px - r, py - r * 0.55, r * 2, r * 1.1);
                ctx.restore();
            }

            ctx.beginPath();
            ctx.arc(px, py, r * 0.48, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.font = `bold ${Math.max(8, Math.round(r * 0.65))}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(number), px, py + 0.5);
            ctx.restore();
        }

        function drawCueBallOnTable(px, py, r) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(px + 1.5, py + 2, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(px, py, r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(px + state.shotParams.tipX * r * 0.45, py - state.shotParams.tipY * r * 0.45, 2.2, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
            ctx.fill();
            ctx.restore();
        }

        function samplePathAtTime(path, elapsed) {
            if (!path || path.length === 0) return { x: 0, y: 0 };
            if (elapsed <= path[0].t) return { x: path[0].x, y: path[0].y };
            const last = path[path.length - 1];
            if (elapsed >= last.t) return { x: last.x, y: last.y };

            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i];
                const p2 = path[i + 1];
                if (elapsed >= p1.t && elapsed <= p2.t) {
                    const alpha = (elapsed - p1.t) / ((p2.t - p1.t) || 1e-6);
                    return { x: p1.x + (p2.x - p1.x) * alpha, y: p1.y + (p2.y - p1.y) * alpha };
                }
            }
            return { x: last.x, y: last.y };
        }

        function startRealtimeAnimation() {
            if (state.animating) {
                state.animating = false;
                document.getElementById('btn-simulate-text').textContent = "Odtwórz uderzenie";
                renderAll();
                return;
            }
            if (!state.currentSimulatedResult || !state.currentSimulatedResult.cuePath.length) {
                recalculateCurrentManualShot();
            }
            state.animating = true;
            state.animStartTime = performance.now();
            document.getElementById('btn-simulate-text').textContent = "Stop";
            requestAnimationFrame(renderAll);
        }

        function setInteractionMode(mode) {
            state.interactionMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = "mode-btn py-1.5 rounded-lg font-medium text-slate-300 hover:bg-slate-800 flex items-center justify-center gap-1 transition";
            });
            const activeBtn = document.getElementById(`mode-${mode}`);
            if (activeBtn) {
                activeBtn.className = "mode-btn py-1.5 rounded-lg font-semibold bg-emerald-600 text-white shadow flex items-center justify-center gap-1 transition";
            }
        }

        function getCanvasMouseMeters(evt, canvasEl) {
            const rect = canvasEl.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            const px = (clientX - rect.left) * (canvasEl.width / rect.width);
            const py = (clientY - rect.top) * (canvasEl.height / rect.height);
            return { px, py, mx: px2mX(px), my: px2mY(py) };
        }

        function clampBallToTable(mx, my) {
            const R = PHYSICS.BALL_R * 1.05;
            return {
                x: Math.max(R, Math.min(PHYSICS.TABLE_W - R, mx)),
                y: Math.max(R, Math.min(PHYSICS.TABLE_H - R, my))
            };
        }

        tableCanvas.addEventListener('pointerdown', (e) => {
            state.animating = false;
            document.getElementById('btn-simulate-text').textContent = "Odtwórz uderzenie";
            const pos = getCanvasMouseMeters(e, tableCanvas);

            for (let pk of POCKETS) {
                if (Math.hypot(pos.mx - pk.x, pos.my - pk.y) < PHYSICS.POCKET_RADIUS * 1.45) {
                    state.selectedPocketId = pk.id;
                    runInverseSolver();
                    return;
                }
            }

            // Większy promień trafienia palcem na smartfonie
            const hitRadius = PHYSICS.BALL_R * 2.5;

            if (state.interactionMode === 'cue') {
                const c = clampBallToTable(pos.mx, pos.my);
                state.cueBall.x = c.x; state.cueBall.y = c.y;
                state.draggingEntity = 'cue';
                runInverseSolver(); return;
            } else if (state.interactionMode === 'object') {
                const c = clampBallToTable(pos.mx, pos.my);
                state.objectBall.x = c.x; state.objectBall.y = c.y;
                state.draggingEntity = 'object';
                runInverseSolver(); return;
            } else if (state.interactionMode === 'target') {
                const c = clampBallToTable(pos.mx, pos.my);
                state.targetPos.x = c.x; state.targetPos.y = c.y;
                state.draggingEntity = 'target';
                runInverseSolver(); return;
            }

            if (Math.hypot(pos.mx - state.cueBall.x, pos.my - state.cueBall.y) < hitRadius) {
                state.draggingEntity = 'cue';
            } else if (Math.hypot(pos.mx - state.objectBall.x, pos.my - state.objectBall.y) < hitRadius) {
                state.draggingEntity = 'object';
            } else if (Math.hypot(pos.mx - state.targetPos.x, pos.my - state.targetPos.y) < hitRadius * 1.2) {
                state.draggingEntity = 'target';
            } else {
                for (let i = 0; i < state.blockers.length; i++) {
                    if (Math.hypot(pos.mx - state.blockers[i].x, pos.my - state.blockers[i].y) < hitRadius) {
                        state.draggingEntity = `blocker-${i}`; break;
                    }
                }
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!state.draggingEntity) return;
            const pos = getCanvasMouseMeters(e, tableCanvas);
            const clamped = clampBallToTable(pos.mx, pos.my);

            if (state.draggingEntity === 'cue') {
                state.cueBall.x = clamped.x; state.cueBall.y = clamped.y;
            } else if (state.draggingEntity === 'object') {
                state.objectBall.x = clamped.x; state.objectBall.y = clamped.y;
            } else if (state.draggingEntity === 'target') {
                state.targetPos.x = clamped.x; state.targetPos.y = clamped.y;
            } else if (state.draggingEntity.startsWith('blocker-')) {
                const idx = parseInt(state.draggingEntity.split('-')[1]);
                if (state.blockers[idx]) {
                    state.blockers[idx].x = clamped.x; state.blockers[idx].y = clamped.y;
                }
            }
            recalculateCurrentManualShot();
        });

        window.addEventListener('pointerup', () => {
            if (state.draggingEntity) {
                state.draggingEntity = null;
                runInverseSolver();
            }
            isDraggingTip = false;
        });

        let isDraggingTip = false;
        function updateTipFromPointer(e) {
            const rect = tipCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const px = (clientX - rect.left) * (tipCanvas.width / rect.width);
            const py = (clientY - rect.top) * (tipCanvas.height / rect.height);

            const cx = tipCanvas.width / 2;
            const cy = tipCanvas.height / 2;
            const maxTipRadiusPx = (tipCanvas.width * 0.43) * 0.72;

            let tx = (px - cx) / maxTipRadiusPx;
            let ty = -(py - cy) / maxTipRadiusPx;

            const mag = Math.hypot(tx, ty);
            if (mag > 1.0) { tx /= mag; ty /= mag; }

            state.shotParams.tipX = tx;
            state.shotParams.tipY = ty;
            state.manualOverride = true;
            recalculateCurrentManualShot();
        }

        tipCanvas.addEventListener('pointerdown', (e) => { isDraggingTip = true; updateTipFromPointer(e); });
        tipCanvas.addEventListener('pointermove', (e) => { if (isDraggingTip) updateTipFromPointer(e); });

        document.getElementById('power-slider').addEventListener('input', (e) => {
            state.shotParams.power = parseInt(e.target.value, 10);
            state.manualOverride = true;
            recalculateCurrentManualShot();
        });

        function addBlockerBall() {
            const palette = [
                { number: 1, color: '#eab308' },
                { number: 2, color: '#2563eb' },
                { number: 3, color: '#dc2626' },
                { number: 4, color: '#7c3aed' },
                { number: 8, color: '#1e293b' }
            ];
            const pick = palette[state.blockers.length % palette.length];
            state.blockers.push({
                x: 1.27 + (Math.random() - 0.5) * 0.35,
                y: 0.63 + (Math.random() - 0.5) * 0.25,
                number: pick.number,
                color: pick.color
            });
            document.getElementById('btn-clear-blockers').classList.remove('hidden');
            runInverseSolver();
        }

        function clearBlockers() {
            state.blockers = [];
            document.getElementById('btn-clear-blockers').classList.add('hidden');
            runInverseSolver();
        }

        function toggleClothColor() {
            state.clothTournamentBlue = !state.clothTournamentBlue;
            renderAll();
        }

        function loadPreset(presetName) {
            state.animating = false;
            state.blockers = [];
            document.getElementById('btn-clear-blockers').classList.add('hidden');

            if (presetName === 'oneRail') {
                state.cueBall = { x: 0.72, y: 0.88 };
                state.objectBall = { x: 1.82, y: 0.36, number: 9 };
                state.selectedPocketId = 2;
                state.targetPos = { x: 1.55, y: 0.85 };
            } else if (presetName === 'drawAngle') {
                state.cueBall = { x: 1.15, y: 0.52 };
                state.objectBall = { x: 1.95, y: 0.32, number: 9 };
                state.selectedPocketId = 2;
                state.targetPos = { x: 1.42, y: 0.96 };
            } else if (presetName === 'twoRailsSpin') {
                state.cueBall = { x: 0.85, y: 0.38 };
                state.objectBall = { x: 1.92, y: 0.25, number: 9 };
                state.selectedPocketId = 2;
                state.targetPos = { x: 1.75, y: 0.98 };
            } else if (presetName === 'obstacleAvoid') {
                state.cueBall = { x: 0.68, y: 0.82 };
                state.objectBall = { x: 1.78, y: 0.38, number: 9 };
                state.selectedPocketId = 2;
                state.targetPos = { x: 1.25, y: 0.90 };
                state.blockers = [{ x: 1.92, y: 0.68, number: 8, color: '#0f172a' }];
                document.getElementById('btn-clear-blockers').classList.remove('hidden');
            }
            runInverseSolver();
        }

        window.addEventListener('resize', resizeTableCanvas);
        window.onload = () => {
            resizeTableCanvas();
            loadPreset('oneRail');
        };
    </script>
</body>
</html>
